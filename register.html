<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng ký - Fashion Store</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="auth-page">


    <!-- HEADER -->

    <header class="auth-header">

        <div class="container auth-navbar">

            <a
                href="index.html"
                class="logo"
            >
                FASHION<span>.</span>
            </a>


            <a
                href="index.html"
                class="back-home"
            >
                ← Trang chủ
            </a>

        </div>

    </header>


    <!-- REGISTER -->

    <main class="auth-main register-main">

        <div class="login-container">


            <!-- REGISTER CARD -->

            <div class="login-card register-card">


                <div class="login-heading">

                    <h1>
                        Tạo tài khoản
                    </h1>

                    <p>
                        Đăng ký để bắt đầu mua sắm cùng Fashion Store
                    </p>

                </div>


                <!-- FORM -->

                <form class="login-form">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Họ và tên
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Nhập họ và tên"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="register-email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="register-email"
                            name="email"
                            placeholder="Nhập email của bạn"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Số điện thoại
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Nhập số điện thoại"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="register-password">
                            Mật khẩu
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="register-password"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirm-password">
                            Xác nhận mật khẩu
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="confirm-password"
                                name="confirmPassword"
                                placeholder="Nhập lại mật khẩu"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- TERMS -->

                    <div class="register-terms">

                        <label>

                            <input
                                type="checkbox"
                                required
                            >

                            <span>
                                Tôi đồng ý với
                                <a href="#">
                                    Điều khoản sử dụng
                                </a>
                                và
                                <a href="#">
                                    Chính sách bảo mật
                                </a>
                                của Fashion Store.
                            </span>

                        </label>

                    </div>


                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Tạo tài khoản
                    </button>


                </form>


                <!-- DIVIDER -->

                <div class="auth-divider">

                    <span></span>

                    <p>
                        Hoặc đăng ký với
                    </p>

                    <span></span>

                </div>


                <!-- SOCIAL REGISTER -->

                <div class="social-login">


                    <button
                        type="button"
                        class="social-button"
                    >

                        <span class="google-icon">
                            G
                        </span>

                        Google

                    </button>


                    <button
                        type="button"
                        class="social-button"
                    >

                        <span class="facebook-icon">
                            f
                        </span>

                        Facebook

                    </button>


                </div>


                <!-- LOGIN -->

                <div class="register-link">

                    <p>
                        Bạn đã có tài khoản?

                        <a href="login.html">
                            Đăng nhập
                        </a>
                    </p>

                </div>


            </div>


            <!-- FOOTER -->

            <div class="auth-footer">

                <p>
                    © 2026 Fashion Store
                </p>

            </div>


        </div>

    </main>


</body>

</html>
