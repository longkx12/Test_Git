<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quên mật khẩu - Fashion Store</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="auth-page">


    <!-- HEADER -->

    <header class="auth-header">

        <div class="container auth-navbar">

            <a
                href="index.html"
                class="logo"
            >
                FASHION<span>.</span>
            </a>


            <a
                href="index.html"
                class="back-home"
            >
                ← Trang chủ
            </a>

        </div>

    </header>


    <!-- FORGOT PASSWORD -->

    <main class="auth-main">

        <div class="login-container">


            <!-- FORGOT PASSWORD CARD -->

            <div class="login-card forgot-card">


                <!-- ICON -->

                <div class="forgot-icon">
                    🔐
                </div>


                <!-- HEADING -->

                <div class="login-heading">

                    <h1>
                        Quên mật khẩu?
                    </h1>

                    <p>
                        Đừng lo lắng! Nhập email của bạn và
                        chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu.
                    </p>

                </div>


                <!-- FORM -->

                <form
                    class="login-form"
                    id="forgotPasswordForm"
                >


                    <div class="form-group">

                        <label for="forgot-email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="forgot-email"
                            name="email"
                            placeholder="Nhập email của bạn"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Gửi yêu cầu
                    </button>


                </form>


                <!-- BACK TO LOGIN -->

                <div class="back-login">

                    <a href="login.html">
                        ← Quay lại đăng nhập
                    </a>

                </div>


                <!-- REGISTER -->

                <div class="register-link">

                    <p>

                        Chưa có tài khoản?

                        <a href="register.html">
                            Đăng ký ngay
                        </a>

                    </p>

                </div>


            </div>


            <!-- FOOTER -->

            <div class="auth-footer">

                <p>
                    © 2026 Fashion Store
                </p>

            </div>


        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        const forgotForm =
            document.getElementById("forgotPasswordForm");


        forgotForm.addEventListener("submit", function (event) {

            event.preventDefault();


            const email =
                document.getElementById("forgot-email").value;


            if (!email) {

                alert("Vui lòng nhập email!");

                return;

            }


            alert(
                "Yêu cầu đặt lại mật khẩu đã được gửi. " +
                "Vui lòng kiểm tra email của bạn."
            );

        });

    </script>


</body>

</html>
