<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập - Fashion Store</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="auth-page">


    <!-- HEADER -->

    <header class="auth-header">

        <div class="container auth-navbar">

            <a
                href="index.html"
                class="logo"
            >
                FASHION<span>.</span>
            </a>


            <a
                href="index.html"
                class="back-home"
            >
                ← Trang chủ
            </a>

        </div>

    </header>


    <!-- LOGIN -->

    <main class="auth-main">

        <div class="login-container">


            <!-- LOGIN CARD -->

            <div class="login-card">


                <div class="login-heading">

                    <h1>
                        Đăng nhập
                    </h1>

                    <p>
                        Đăng nhập để tiếp tục mua sắm
                    </p>

                </div>


                <!-- FORM -->

                <form class="login-form">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Nhập email của bạn"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <div class="password-label">

                            <label for="password">
                                Mật khẩu
                            </label>

                            <a href="#">
                                Quên mật khẩu?
                            </a>

                        </div>


                        <div class="password-input">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- REMEMBER -->

                    <div class="remember-row">

                        <label class="remember">

                            <input
                                type="checkbox"
                                name="remember"
                            >

                            <span>
                                Ghi nhớ đăng nhập
                            </span>

                        </label>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Đăng nhập
                    </button>


                </form>


                <!-- DIVIDER -->

                <div class="auth-divider">

                    <span></span>

                    <p>
                        Hoặc đăng nhập với
                    </p>

                    <span></span>

                </div>


                <!-- SOCIAL LOGIN -->

                <div class="social-login">


                    <button
                        type="button"
                        class="social-button"
                    >

                        <span class="google-icon">
                            G
                        </span>

                        Google

                    </button>


                    <button
                        type="button"
                        class="social-button"
                    >

                        <span class="facebook-icon">
                            f
                        </span>

                        Facebook

                    </button>


                </div>


                <!-- REGISTER -->

                <div class="register-link">

                    <p>
                        Chưa có tài khoản?
                        <a href="register.html">
                            Đăng ký ngay
                        </a>
                    </p>

                </div>


            </div>


            <!-- LOGIN FOOTER -->

            <div class="auth-footer">

                <p>
                    © 2026 Fashion Store
                </p>

            </div>


        </div>

    </main>


</body>

</html>
