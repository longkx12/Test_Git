<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lấy lại mật khẩu - Fashion Store</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="auth-page">


    <!-- HEADER -->

    <header class="auth-header">

        <div class="container auth-navbar">

            <a
                href="index.html"
                class="logo"
            >
                FASHION<span>.</span>
            </a>


            <a
                href="index.html"
                class="back-home"
            >
                ← Trang chủ
            </a>

        </div>

    </header>


    <!-- RESET PASSWORD -->

    <main class="auth-main">

        <div class="login-container">


            <!-- RESET CARD -->

            <div class="login-card reset-card">


                <!-- ICON -->

                <div class="forgot-icon">
                    🔑
                </div>


                <!-- HEADING -->

                <div class="login-heading">

                    <h1>
                        Lấy lại mật khẩu
                    </h1>

                    <p>
                        Tạo mật khẩu mới cho tài khoản của bạn.
                        Hãy sử dụng mật khẩu mạnh để bảo vệ tài khoản.
                    </p>

                </div>


                <!-- FORM -->

                <form
                    class="login-form"
                    id="resetPasswordForm"
                >


                    <!-- NEW PASSWORD -->

                    <div class="form-group">

                        <label for="new-password">
                            Mật khẩu mới
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="new-password"
                                name="newPassword"
                                placeholder="Nhập mật khẩu mới"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirm-new-password">
                            Xác nhận mật khẩu
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="confirm-new-password"
                                name="confirmPassword"
                                placeholder="Nhập lại mật khẩu mới"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- PASSWORD REQUIREMENTS -->

                    <div class="password-requirements">

                        <p>
                            Mật khẩu nên có:
                        </p>

                        <ul>

                            <li>
                                Ít nhất 6 ký tự
                            </li>

                            <li>
                                Có ít nhất một chữ cái
                            </li>

                            <li>
                                Có ít nhất một chữ số
                            </li>

                        </ul>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Đặt lại mật khẩu
                    </button>


                </form>


                <!-- BACK LOGIN -->

                <div class="back-login">

                    <a href="login.html">
                        ← Quay lại đăng nhập
                    </a>

                </div>


            </div>


            <!-- FOOTER -->

            <div class="auth-footer">

                <p>
                    © 2026 Fashion Store
                </p>

            </div>


        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        const resetForm =
            document.getElementById("resetPasswordForm");


        resetForm.addEventListener("submit", function (event) {

            event.preventDefault();


            const password =
                document.getElementById("new-password").value;


            const confirmPassword =
                document.getElementById("confirm-new-password").value;


            /*
             * Kiểm tra độ dài
             */

            if (password.length < 6) {

                alert(
                    "Mật khẩu phải có ít nhất 6 ký tự!"
                );

                return;

            }


            /*
             * Kiểm tra chữ cái
             */

            if (!/[A-Za-z]/.test(password)) {

                alert(
                    "Mật khẩu phải có ít nhất một chữ cái!"
                );

                return;

            }


            /*
             * Kiểm tra chữ số
             */

            if (!/[0-9]/.test(password)) {

                alert(
                    "Mật khẩu phải có ít nhất một chữ số!"
                );

                return;

            }


            /*
             * Kiểm tra xác nhận mật khẩu
             */

            if (password !== confirmPassword) {

                alert(
                    "Mật khẩu xác nhận không khớp!"
                );

                return;

            }


            /*
             * Thành công
             */

            alert(
                "Đặt lại mật khẩu thành công!"
            );


            /*
             * Chuyển về trang đăng nhập
             */

            window.location.href =
                "login.html";

        });


        /*
         * HIỂN THỊ / ẨN MẬT KHẨU
         */

        const passwordButtons =
            document.querySelectorAll(".show-password");


        passwordButtons.forEach(function (button) {

            button.addEventListener("click", function () {

                const input =
                    this.parentElement.querySelector("input");


                if (input.type === "password") {

                    input.type = "text";

                    this.textContent = "🙈";

                } else {

                    input.type = "password";

                    this.textContent = "👁";

                }

            });

        });

    </script>


</body>

</html>
